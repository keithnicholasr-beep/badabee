services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: badabee
      POSTGRES_USER: badabee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - badabee-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badabee -d badabee"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  badabee-db:
