name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: badabee
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: badabee_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U badabee -d badabee_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://badabee:ci-test-only-password@localhost:5432/badabee_test
      TEST_DATABASE_URL: postgresql+psycopg://badabee:ci-test-only-password@localhost:5432/badabee_test
      JWT_SECRET: ci-test-only-jwt-secret-at-least-32-characters
      DISTRESS_INGEST_KEY: ci-test-only-integration-secret-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swastya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: swastya/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
